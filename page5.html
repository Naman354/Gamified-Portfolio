<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typing Challenge</title>
  <link rel="stylesheet" href="styles5.css" />
</head>
<body>
  <!-- Level nav -->
  <nav id="level-nav">
    <span id="level-text">Level 3</span>
    <div id="progress-bar">
      <div id="progress-fill" style="width:0%"></div>
    </div>
  </nav>

  <!-- Typing challenge section -->
  <section id="challenge-section">
    <h2 id="challenge-title">TYPING CHALLENGE</h2>
    <p id="challenge-instruction">Type the text below as fast and accurately as you can!</p>

    <div id="challenge-card">
      <p id="target-text">The quick brown fox jumps over the lazy dog.</p>
      <textarea id="typing-input" placeholder="Start typing here..."></textarea>
      <div class="info-bar">
        <span id="timer">⏱ 90s</span>
        <span id="status-msg"></span>
      </div>
      <button id="submit-btn">Submit</button>
    </div>
  </section>

  <!-- Contact section (hidden initially) -->
  <section id="contact-section" style="display:none;">
    <div id="contact-card">
      <h2>Contact Me</h2>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name*</label>
          <input type="text" id="name" required />
          <span class="error" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email*</label>
          <input type="email" id="email" required />
          <span class="error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="message">Message*</label>
          <textarea id="message" required></textarea>
          <span class="error" id="message-error"></span>
        </div>

        <button type="submit">Send</button>
      </form>
    </div>
  </section>

<!-- Level Up popup -->
<div id="level-up" aria-hidden="true" style="display:none">
  <h1 id="level-heading">LEVEL 3</h1> <!-- This will dynamically update to the current level -->
  <h2 id="xp-earned">XP Earned: 0</h2>
  <p class="congrats">🎉 Congratulations! You finished the game!</p>
  <button id="continue-btn">Continue</button>
</div>


  <script src="script5.js"></script>
</body>
</html>
